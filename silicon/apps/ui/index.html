<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Silicon Workbench</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <nav class="side-nav" aria-label="Silicon">
        <div class="brand-mark" title="Silicon">Si</div>
        <button class="nav-item active" data-view="workbench" title="工作台" aria-label="工作台"><span>⌘</span></button>
        <button class="nav-item" data-view="employees" title="员工" aria-label="员工"><span>员</span></button>
        <button class="nav-item" data-view="tasks" title="任务" aria-label="任务"><span>单</span></button>
        <button class="nav-item" data-view="approvals" title="审批" aria-label="审批"><span>审</span></button>
        <button class="nav-item" data-view="library" title="证据库" aria-label="证据库"><span>库</span></button>
      </nav>
      <main class="workspace">
        <header class="runtime-bar">
          <div class="workspace-title">
            <div class="eyebrow">Local AI Employee Runtime</div>
            <div class="product-title" role="heading" aria-level="1">Silicon Workbench</div>
          </div>
          <div>
            <span class="bar-label">运行根目录</span>
            <span id="runtimeRoot" class="mono">-</span>
          </div>
          <div>
            <span class="bar-label">daemon</span>
            <span id="daemonStatus" class="status-dot neutral">stopped</span>
          </div>
          <div>
            <span class="bar-label">ticks</span>
            <span id="tickCount" class="mono">0</span>
          </div>
          <div class="bar-actions">
            <button id="refreshBtn" class="tool-button">刷新</button>
            <button id="daemonTickBtn" class="tool-button primary">Tick</button>
          </div>
        </header>
        <section class="metrics" aria-label="runtime metrics">
          <article><span id="metricEmployees">0</span><label>员工</label></article>
          <article><span id="metricRunning">0</span><label>运行中</label></article>
          <article><span id="metricWaiting">0</span><label>待审批</label></article>
          <article><span id="metricBlocked">0</span><label>已阻塞</label></article>
          <article><span id="metricFailed">0</span><label>失败</label></article>
        </section>
        <section class="command-strip">
          <form id="employeeForm" class="inline-form">
            <div class="form-title">创建员工</div>
            <input name="employeeId" placeholder="员工 ID" required>
            <input name="displayName" placeholder="显示名称" required>
            <select name="definitionId">
              <option value="document-organizer">资料整理员工</option>
              <option value="code-reviewer">代码审查员工</option>
              <option value="ops-runner">运维执行员工</option>
            </select>
            <button class="tool-button">创建</button>
          </form>
          <form id="taskForm" class="inline-form">
            <div class="form-title">创建任务</div>
            <select name="employeeId" id="taskEmployeeSelect"></select>
            <input name="taskId" placeholder="任务 ID" required>
            <input name="title" placeholder="标题" required>
            <input name="instruction" placeholder="执行说明" required>
            <select name="capability">
              <option value="">artifact.write</option>
              <option value="filesystem.read">filesystem.read</option>
              <option value="shell.execute">shell.execute</option>
              <option value="network.external">network.external</option>
            </select>
            <button class="tool-button">创建</button>
          </form>
        </section>
        <section class="workbench-grid">
          <section class="panel">
            <header class="panel-header">
              <div class="section-title" role="heading" aria-level="1">员工运行面板</div>
              <div class="segmented" id="employeeFilters">
                <button data-filter="all" class="active">All</button>
                <button data-filter="running">Running</button>
                <button data-filter="waiting">Waiting</button>
                <button data-filter="blocked">Blocked</button>
                <button data-filter="failed">Failed</button>
              </div>
            </header>
            <div id="employeeList" class="table-list"></div>
          </section>
          <section class="panel">
            <header class="panel-header">
              <div class="section-title" role="heading" aria-level="1">队列流</div>
            </header>
            <div id="queueStream" class="stream-list"></div>
          </section>
          <aside class="panel action-panel">
            <header class="panel-header">
              <div class="section-title" role="heading" aria-level="1">需要处理</div>
            </header>
            <div id="actionRequired" class="action-list"></div>
          </aside>
        </section>
      </main>
      <aside id="inspector" class="inspector" aria-live="polite">
        <header>
          <div id="inspectorTitle" class="section-title" role="heading" aria-level="2">Inspector</div>
          <button id="closeInspector" class="icon-button" title="关闭">×</button>
        </header>
        <div id="inspectorBody" class="inspector-body"></div>
      </aside>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
